name: wp-audit
# 読み取りだけ。feed.json の各記事が WordPress にどんな状態で入っているか（下書きか・アイキャッチ・カテゴリ）を表示する。
# 何も書き換えない。手動実行（Run workflow）専用。
on:
  workflow_dispatch:
concurrency: wp-import
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python3 scripts/wp_import.py --audit
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          IMPORT_MODE: draft
